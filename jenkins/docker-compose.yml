services:
  jenkins:
    build: .
    container_name: jenkins
    user: root            # lab only: lets Jenkins use the Docker socket
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - buildlab
    restart: unless-stopped

volumes:
  jenkins_home:

networks:
  buildlab:
    name: buildlab
